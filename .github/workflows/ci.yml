name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Type and Astro check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Build submission-enabled variant (test key; for planner submit tests only)
        run: npm run build:submit
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end, accessibility and navigation tests
        run: npm run test:e2e
      - name: Publish responsive visual-review evidence
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: responsive-review
          path: playwright-report/
          retention-days: 14
          if-no-files-found: error
      - name: Same suite on the local Cloudflare Workers runtime (routing, headers, API)
        run: npm run test:runtime
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
