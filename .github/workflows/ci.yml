name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format
        id: format
        run: npm run format:check
      - name: Show formatter corrections on failure
        if: failure() && steps.format.outcome == 'failure'
        run: |
          npx prettier --write . > /dev/null
          git diff --no-ext-diff
      - name: Type and Astro check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Offline fictional receipt harness
        run: node scripts/email-receipt-test.mjs
        env:
          TWN_RECEIPT_MODE: mock
      - name: Build
        run: npm run build
      - name: Build submission-enabled variant (test key; for planner submit tests only)
        run: npm run build:submit
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end, accessibility and navigation tests
        run: npm run test:e2e
      - name: Publish responsive visual-review evidence
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: responsive-review
          path: playwright-report/
          retention-days: 14
          if-no-files-found: error
      - name: Same suite on the local Cloudflare Workers runtime (routing, headers, API)
        run: npm run test:runtime
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  editorial-fixtures:
    runs-on: ubuntu-latest
    # Cold image generation measured 9m10s; leave time for the 96 browser checks.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium for editorial templates
        run: npx playwright install --with-deps chromium
      - name: Verify populated editorial pages with disposable synthetic CI fixtures
        run: npm run test:editorial-fixtures
      - name: Preserve editorial composition screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-compositions
          path: test-results/**/*.png
          retention-days: 7
          if-no-files-found: ignore

  cross-browser-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:submit
      - name: Install Firefox and WebKit
        run: npx playwright install --with-deps firefox webkit
      - name: Check visual layout and catering in Firefox and WebKit
        run: >-
          npm run test:e2e:cross --
          tests/e2e/visual-review.spec.ts
          tests/e2e/hero-fit.spec.ts
          tests/e2e/catering-art-direction.spec.ts
          tests/e2e/operator-ui.spec.ts
          --grep-invert "the kitchen film plays when visible and can be paused"
      - name: Retain cross-browser review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-browser-layout
          path: playwright-report/
          retention-days: 7
          if-no-files-found: warn
