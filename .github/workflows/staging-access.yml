name: Staging Access boundary verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/verify-staging-access.test.mjs"
      - ".github/workflows/staging-access.yml"

permissions:
  contents: read

jobs:
  staging-access-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify deployed unauthenticated boundary without writing data
        run: node --test scripts/verify-staging-access.test.mjs
