<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Enquiries — The Wedding Nest operator</title>
    <link rel="stylesheet" href="/operator/operator.css" />
  </head>
  <body>
    <header>
      <h1>Enquiries</h1>
      <label>
        Show
        <select id="filter">
          <option value="">All</option>
          <option value="new">New</option>
          <option value="contacted">Contacted</option>
          <option value="in_progress">In progress</option>
          <option value="booked">Booked</option>
          <option value="unsuccessful">Unsuccessful</option>
        </select>
      </label>
      <details id="delivery">
        <summary>Notification delivery</summary>
        <p class="delivery-note">
          Read-only queue overview. Provider acceptance does not confirm inbox receipt.
        </p>
        <dl id="delivery-counts">
          <div>
            <dt>Provider accepted</dt>
            <dd id="delivery-accepted">—</dd>
          </div>
          <div>
            <dt>Held for review</dt>
            <dd id="delivery-held">—</dd>
          </div>
          <div>
            <dt>Unconfirmed acceptance</dt>
            <dd id="delivery-unconfirmed">—</dd>
          </div>
          <div>
            <dt>Currently processing</dt>
            <dd id="delivery-leased">—</dd>
          </div>
          <div>
            <dt>Retry scheduled</dt>
            <dd id="delivery-retry">—</dd>
          </div>
          <div>
            <dt>Ready for processing</dt>
            <dd id="delivery-ready">—</dd>
          </div>
        </dl>
        <p id="delivery-message" aria-live="polite"></p>
        <button id="delivery-refresh" type="button">Refresh delivery overview</button>
      </details>
    </header>
    <main>
      <p id="message" role="status" aria-live="polite"></p>
      <ul id="list" aria-label="Enquiries"></ul>
      <button id="more" type="button" hidden>Load older</button>
      <section id="detail" aria-labelledby="detail-title" hidden>
        <button id="back" type="button">← Back to list</button>
        <h2 id="detail-title" tabindex="-1"></h2>
        <dl id="fields"></dl>
        <div id="actions" role="group" aria-label="Update status"></div>
      </section>
    </main>
    <script src="/operator/labels.js" defer></script>
    <script src="/operator/operator.js" defer></script>
  </body>
</html>
